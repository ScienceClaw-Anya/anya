name: Offline ScienceClaw integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-scienceclaw.txt
      - run: python -m pip install -r requirements-scienceclaw.txt
      - run: python scripts/setup_upstreams.py --only scienceclaw
      - run: python -m pytest tests/test_scienceclaw_integration.py tests/test_infinite_gateway.py tests/test_report.py tests/test_diagnosis.py tests/test_real_data.py tests/test_diagnostic_integration.py -q
        env:
          PYTHONUTF8: '1'

  reproduction-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.25.1 scipy==1.11.4 scikit-learn==1.3.0
      - run: python -m unittest discover -s reproduction/norris2024 -p 'test_reproduction.py' -v
        env:
          PYTHONUTF8: '1'

  spes-agent-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-spes-agent-v2.txt
      - run: python -m pip install -r requirements-spes-agent-v2.txt
      - run: python scripts/setup_upstreams.py --only scienceclaw
      - run: python -m unittest experiments.spes_agent_v2.test_experiment -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v3.test_v3 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v4.test_v4 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v5.test_v5 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v6.test_v6 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v7.test_v7 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v8.test_v8 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v9.test_v9 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v10.test_v10 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_physical.test_mapping -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v13.test_tools -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v14.test_tools -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v15.test_readout -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v16.test_v16 -v
        env:
          PYTHONUTF8: '1'
      - run: python -m unittest experiments.spes_agent_v16_supplement.test_supplement -v
        env:
          PYTHONUTF8: '1'
